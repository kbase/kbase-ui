---
name: Test (unit, integration)
on:
    workflow_call:
jobs:
    run-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Check out GitHub Repo
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22.23.4'

            # Run tests
            - name: Run all tests
              run: make test

