name: kbase-dev
networks:
    kbase-dev:
        name: kbase-dev
services:
    kbase-ui:
        build:
            context: .
            dockerfile: Dockerfile
        image: ${IMAGE:-local/kbase-ui:dev}
        container_name: kbase-ui
        dns: 8.8.8.8
        networks:
            - kbase-dev
        env_file: .devcontainer/runtime.env
